services:
  backend: 
    build: ./backend
    container_name: link-shortener-backend
    ports: 
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: test
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped


  frontend:
    build: ./frontend
    container_name: link-shortener-frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
    
